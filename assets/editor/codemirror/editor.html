<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        --p5de-accent: #256af4;
        --p5de-accent-hover: #1d4ed8;
        --p5de-accent-soft: #eaf1ff;
        --p5de-accent-border: #bfdbfe;
        --p5de-accent-ring: rgba(37, 106, 244, 0.14);
        --p5de-surface: #ffffff;
        --p5de-muted-surface: #f8fafc;
        --p5de-toolbar: #f1f5f9;
        --p5de-border: #e2e8f0;
        --p5de-text: #0f172a;
        --p5de-muted-text: #64748b;
        --p5de-faint-text: #94a3b8;
        --p5de-control-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      html,
      body,
      #editor {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--p5de-surface);
        overflow: hidden;
      }

      .cm-editor {
        height: 100%;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono",
          Menlo, monospace;
        font-size: 18px;
      }

      .cm-scroller {
        font-family: inherit;
        line-height: 1.45;
      }

      .cm-gutters {
        background: var(--p5de-muted-surface);
        border-right: 1px solid var(--p5de-border);
        color: var(--p5de-faint-text);
        padding-right: 10px;
      }

      .cm-content {
        padding: 28px 16px 80px 20px;
      }

      .cm-lineNumbers .cm-gutterElement {
        min-width: 48px;
        padding: 0 14px 0 8px;
      }

      .cm-activeLine,
      .cm-activeLineGutter {
        background: #f8fafc;
      }

      .cm-focused {
        outline: none;
      }

      .tok-keyword {
        color: #9333ea;
      }

      .tok-string {
        color: var(--p5de-accent);
      }

      .tok-number {
        color: #ea580c;
      }

      .tok-comment {
        color: var(--p5de-muted-text);
        font-style: italic;
      }

      .tok-variableName,
      .tok-function {
        color: #2563eb;
      }

      .cm-panels.cm-panels-top {
        background: var(--p5de-surface);
        border-bottom: 1px solid var(--p5de-border);
      }

      .cm-panel.cm-search.p5de-find-panel {
        box-sizing: border-box;
        padding: 12px 14px 10px;
        position: static;
        background: var(--p5de-surface);
        color: var(--p5de-text);
        font-family: Roboto, "Segoe UI", Arial, sans-serif;
      }

      .cm-panel.cm-search.p5de-find-panel input,
      .cm-panel.cm-search.p5de-find-panel button {
        margin: 0;
      }

      .p5de-find-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .p5de-find-input {
        box-sizing: border-box;
        flex: 1 1 180px;
        min-width: 0;
        height: 40px;
        border: 1px solid var(--p5de-border);
        border-radius: 8px;
        background: var(--p5de-muted-surface);
        color: var(--p5de-text);
        font: inherit;
        font-size: 14px;
        font-weight: 400;
        line-height: 40px;
        padding: 0 12px;
      }

      .p5de-find-input::placeholder {
        color: var(--p5de-faint-text);
        font-weight: 400;
      }

      .p5de-find-input:focus {
        border-color: var(--p5de-accent);
        box-shadow: 0 0 0 3px var(--p5de-accent-ring);
        outline: none;
      }

      .p5de-find-button {
        box-sizing: border-box;
        min-width: 40px;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--p5de-muted-text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        padding: 0;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          transform 120ms ease;
      }

      .p5de-find-button:focus-visible {
        outline: 2px solid var(--p5de-accent);
        outline-offset: 2px;
      }

      .p5de-find-button:hover,
      .p5de-find-button:focus {
        background: var(--p5de-toolbar);
        color: var(--p5de-text);
      }

      .p5de-find-button:active {
        transform: scale(0.98);
      }

      .p5de-find-caret {
        font-size: 32px;
        font-weight: 650;
      }

      .p5de-find-close {
        color: var(--p5de-faint-text);
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
      }

      @media (max-width: 520px) {
        .p5de-find-row {
          flex-wrap: wrap;
        }

        .p5de-find-input {
          flex-basis: 100%;
        }

        .p5de-find-button:not(.p5de-find-close) {
          flex: 0 0 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script>
      window.__p5deQueuedMessages = [];
      window.__p5deQueueMessage = function (event) {
        window.__p5deQueuedMessages.push(event.data);
      };
      window.addEventListener("message", window.__p5deQueueMessage);
    </script>
    <script src="editor.bundle.js"></script>
  </body>
</html>
